# Legacy server (VMess inbound). Usage:
#   cp ../../docker/env/server-legacy.env.example .env   # then fill from vault
#   docker compose up -d
services:
  xray:
    image: ${IMAGE_REPO:-youruser/infra}:server-legacy
    container_name: proxy-server
    restart: unless-stopped
    user: "0"
    env_file: .env
    ports:
      - "${LISTEN_PORT}:${LISTEN_PORT}"
    volumes:
      - ./logs:/var/log/v2ray
